name: Healthcare DW Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bronze_ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Snowflake CLI
        run: |
          pip install --upgrade pip
          pip install --user snowflake-cli
          echo "$(python -m site --user-base)/bin" >> $GITHUB_PATH
          export PATH="$(python -m site --user-base)/bin:$PATH"

      - name: Configure Snowflake connection
        env:
          SNOWFLAKE_HOST: ${{ secrets.SNOWFLAKE_HOST }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: |
          # Export password into the variable Snowflake CLI expects
          export SNOWSQL_PWD=$SNOWFLAKE_PASSWORD

          snow connection add \
            --connection-name default \
            --host $SNOWFLAKE_HOST \
            --port 443 \
            --protocol https \
            --region AZURE_CENTRALINDIA \
            --account $SNOWFLAKE_ACCOUNT \
            --authenticator snowflake \
            --username $SNOWFLAKE_USER \
            --rolename $SNOWFLAKE_ROLE \
            --warehouse $SNOWFLAKE_WAREHOUSE \
            --dbname $SNOWFLAKE_DATABASE \
            --schemaname $SNOWFLAKE_SCHEMA

      - name: Run Snowflake Stored Procedure
        env:
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          export SNOWSQL_PWD=$SNOWFLAKE_PASSWORD
          snow sql --connection-name default --query "CALL OPS.SP_FILE_INGEST_DUMP();"

  dbt_transform:
    runs-on: ubuntu-latest
    needs: bronze_ingest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt
        run: pip install dbt-core dbt-snowflake

      - name: Run dbt Silver models
        env:
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: dbt run --select silver/*

      - name: Run dbt Gold models
        env:
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: dbt run --select gold/*

      - name: Run dbt tests
        env:
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: dbt test
