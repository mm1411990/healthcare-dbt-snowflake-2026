name: Healthcare DW Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bronze_ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Snowflake CLI
        run: |
          pip install --upgrade pip
          pip install --user snowflake-cli-labs==3.25.0
          echo "$(python -m site --user-base)/bin" >> $GITHUB_PATH
          export PATH="$(python -m site --user-base)/bin:$PATH"

      - name: Configure Snowflake connection
        env:
          SNOWSQL_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWSQL_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWSQL_HOST: ${{ secrets.SNOWFLAKE_HOST }}
          SNOWSQL_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWSQL_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWSQL_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWSQL_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml <<EOF
          [connections.default]
          account = "$SNOWSQL_ACCOUNT"
          host = "$SNOWSQL_HOST"
          user = "$SNOWSQL_USER"
          password = "$SNOWSQL_PWD"
          role = "$SNOWSQL_ROLE"
          warehouse = "$SNOWSQL_WAREHOUSE"
          database = "$SNOWSQL_DATABASE"
          schema = "$SNOWSQL_SCHEMA"
          authenticator = "snowflake"
          EOF
          chmod 0600 ~/.snowflake/config.toml

      - name: Run Snowflake Stored Procedure
        run: snow sql --connection default --query "CALL OPS.SP_FILE_INGEST_DUMP();"

  dbt_transform:
    runs-on: ubuntu-latest
    needs: bronze_ingest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install --user dbt-snowflake==1.8.2
          echo "$(python -m site --user-base)/bin" >> $GITHUB_PATH
          export PATH="$(python -m site --user-base)/bin:$PATH"

      - name: Configure dbt profile
        env:
          SNOWSQL_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWSQL_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWSQL_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWSQL_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWSQL_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          healthcare_snow_dbt:
            outputs:
              dev:
                type: snowflake
                account: $SNOWSQL_ACCOUNT
                user: $SNOWSQL_USER
                password: $SNOWSQL_PWD
                role: $SNOWSQL_ROLE
                warehouse: $SNOWSQL_WAREHOUSE
                database: $SNOWSQL_DATABASE
                schema: silver
                threads: 1
            target: dev
          EOF

      - name: Run dbt build
        run: dbt build
